    <script>//some mock test
    const MOCK_HOURS=12;
function uhb(hours){
const caps=[20,10,20];// it is a bit uneven like 20 10 20 but 60 hour was very much 
let remaining=hours;
const fillIds=['hpFill1', 'hpFill2','hpFill3'];
caps.forEach ((cap, i)=>{const used=Math.max(0, 
    Math.min(remaining,cap)
);
const pct =(used/ cap)*100; 
document.getElementById(fillIds[i]).style.width =pct +'%';
remaining -= used;
});
document.getElementById('hpHoursText').textContent= hours+'hrs logged';
 let stage=1;
 if (hours>=20 && hours< 30) stage=2;
 else if (hours>=30) 
 stage=3;
document.getElementById('hpStageText').textContent='Stage'+stage;
}
uhb(MOCK_HOURS);
const MOCK_ELIGIBLE =true; // false for the same
function updateEligibility(isEligible){const el=document.getElementById('eligibilityValue');
el.textContent =isEligible ?'Eligible' :'NOT LEGAL';
el.classList.add(isEligible ?'eligible': 'ineligible');
}
updateEligibility(MOCK_ELIGIBLE);

document.querySelectorAll('.dash-nav-item[data-section]').forEach(function(item){
    item.addEventListener('click' ,function(e){e.preventDefault();
        document.querySelectorAll('.dash-nav-item[data-section]').forEach(function(i){ 
            i.classList.remove('active');
        }); 
    this.classList.add('active'); document.querySelectorAll('#section-home,#section-shop').forEach(
        function(s){s.style.display ='none' ;}
     );document.getElementById('section-' +this.dataset.section).style.display ='block';
});});
document.querySelectorAll('.region-chip').forEach(function(chip){
    chip.addEventListener('click' ,function (){
        document.querySelectorAll('.region-chip').forEach(function(c){
            c.classList.remove('active') ;
        });
         this.classList.add('active');
    });
});
